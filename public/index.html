  .tarjeta{background:var(--noche-800);border:1px solid var(--noche-700);border-radius:14px;padding:22px;}

<script>
/* =============================================================================
   ONÍRICO — frontend que habla con el backend real (server.js)
   Todas las llamadas usan fetch() con credentials:'include' para que la
   cookie de sesión (JWT) viaje en cada petición.
   ============================================================================= */

const API = ""; // mismo origen: el backend sirve este propio archivo

async function api(ruta, opciones={}){
  const resp = await fetch(API+ruta, {
    credentials:"include",
    headers:{ "Content-Type":"application/json", ...(opciones.headers||{}) },
    ...opciones
  });
  const datos = await resp.json().catch(()=>({}));
  if(!resp.ok) throw new Error(datos.error || "Error de conexión.");
  return datos;
}

    home:{titulo:"Aprèn a habitar els teus somnis",subtitulo:"Guia científica i pràctica per descobrir, entrenar i gaudir dels somnis lúcids, amb el teu progrés personal.",cta:"Crea un compte",cta2:"Veure la ciència"},
    auth:{email:"Correu electrònic",password:"Contrasenya",nombre:"Nom",entrar:"Entra",crear:"Crea un compte",yaCuenta:"Ja tinc compte",noCuenta:"Encara no tinc compte"},
    educacion:{titulo:"Què és un somni lúcid?",intro:"Un somni lúcid és, senzillament, un somni en què t'adones que estàs somiant mentre passa.",cerebroTitulo:"Què passa al cervell mentre somies?",cerebroTexto:"La majoria de somnis vívids passen en la fase REM. El cervell està molt actiu, gairebé com despert, mentre el cos roman paralitzat. En un somni lúcid augmenta l'activitat a l'escorça prefrontal, la zona del raonament i l'autoconsciència.",beneficiosTitulo:"Beneficis i riscos",beneficiosTexto:"Entre els beneficis: menys malsons recurrents, un espai segur per practicar habilitats, i l'experiència creativa d'explorar la teva pròpia ment. Amb moderació: algunes tècniques poden generar cansament si se n'abusa."},

    cerebro:{titulo:"El cervell que somia",intro:"Toca cada zona per descobrir el seu paper durant el son."},
    rutina:{titulo:"La teva rutina de pràctica",intro:"Marca cada dia les tècniques que practiquis.",anadir:"Afegeix"},
    perfil:{titulo:"El teu perfil",nombre:"Nom",idioma:"Idioma",guardar:"Desa",totalSuenos:"Somnis registrats",totalLucidos:"Somnis lúcids"},
    comun:{racha:"dies seguits",cargando:"Carregant..."} },

    auth:{email:"Email",password:"Password",nombre:"Name",entrar:"Log in",crear:"Create account",yaCuenta:"I already have an account",noCuenta:"I don't have an account yet"},

let idioma = localStorage.getItem("onirico_idioma") || "es";
function t(ruta){ let v=TEXTOS[idioma]; for(const p of ruta.split(".")) v=v?.[p]; return v??ruta; }

// ---------------------------------------------------------------------------
// ESTADO
// ---------------------------------------------------------------------------
let usuarioActual = null;
let seccionActual = "inicio";
let socket = null;

const SECCIONES_PUBLICAS = ["inicio","educacion","tecnicas","cerebro"];
const SECCIONES_PRIVADAS = ["diario","comunidad","rutina","perfil"];

async function cargarSesion(){
  try{ usuarioActual = (await api("/api/auth/yo")).usuario; }catch{ usuarioActual = null; }
}

function irA(sec){
  if(SECCIONES_PRIVADAS.includes(sec) && !usuarioActual){ seccionActual="login"; render(); return; }
  seccionActual = sec; render();
}

// ---------------------------------------------------------------------------
// FONDO DE ESTRELLAS
// ---------------------------------------------------------------------------
function iniciarEstrellas(){
  const cont = document.getElementById("estrellas");
  const canvas = document.createElement("canvas"); cont.appendChild(canvas);
  const ctx = canvas.getContext("2d");
  function ajustar(){ canvas.width=innerWidth; canvas.height=innerHeight; }
  ajustar(); addEventListener("resize", ajustar);
  const estrellas = Array.from({length:120},()=>({x:Math.random()*innerWidth,y:Math.random()*innerHeight,r:Math.random()*1.2+0.3,fase:Math.random()*Math.PI*2,vel:Math.random()*0.02+0.005}));
  function dibujar(tm){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    estrellas.forEach(e=>{ const b=0.4+0.6*Math.abs(Math.sin(e.fase+tm*e.vel)); ctx.beginPath(); ctx.arc(e.x,e.y,e.r,0,7); ctx.fillStyle=`rgba(237,238,245,${b})`; ctx.fill(); });
    requestAnimationFrame(dibujar);
  }
  requestAnimationFrame(dibujar);
}

// ---------------------------------------------------------------------------
// NAV
// ---------------------------------------------------------------------------
function renderNav(){
  const nav = document.getElementById("nav");
  nav.innerHTML = "";
  const secciones = usuarioActual ? [...SECCIONES_PUBLICAS,...SECCIONES_PRIVADAS] : SECCIONES_PUBLICAS;
  secciones.forEach(sec=>{
    const b=document.createElement("button");
    b.textContent = t(`nav.${sec}`); if(sec===seccionActual) b.classList.add("activo");
    b.onclick=()=>irA(sec); nav.appendChild(b);
  });
  const idiomasDiv = document.getElementById("idiomas"); idiomasDiv.innerHTML="";
  ["es","ca","en"].forEach(c=>{
    const b=document.createElement("button"); b.textContent=c.toUpperCase();
    if(c===idioma) b.classList.add("activo");
    b.onclick=()=>{ idioma=c; localStorage.setItem("onirico_idioma",c); render(); };
    idiomasDiv.appendChild(b);
  });
  const zonaUsuario = document.getElementById("zona-usuario");
  if(usuarioActual){
    zonaUsuario.innerHTML = `<button class="btn-secundario" id="btn-salir" style="padding:6px 14px;">${t("nav.salir")}</button>`;
    zonaUsuario.querySelector("#btn-salir").onclick = async ()=>{ await api("/api/auth/logout",{method:"POST"}); usuarioActual=null; irA("inicio"); if(socket) socket.disconnect(); };
  } else {
    zonaUsuario.innerHTML = `<button class="btn-secundario" id="btn-login" style="padding:6px 14px;">${t("nav.login")}</button>`;
    zonaUsuario.querySelector("#btn-login").onclick = ()=>{ seccionActual="login"; render(); };
  }
}

// ---------------------------------------------------------------------------
// RENDER PRINCIPAL
// ---------------------------------------------------------------------------
async function render(){
  renderNav();
  const main = document.getElementById("main");
  main.innerHTML = `<p style="color:var(--niebla-500);text-align:center;">${t("comun.cargando")}</p>`;
  const fns = { inicio:renderInicio, educacion:renderEducacion, tecnicas:renderTecnicas, cerebro:renderCerebro,
    login:renderLogin, registro:renderRegistro, diario:renderDiario, comunidad:renderComunidad,
    rutina:renderRutina, perfil:renderPerfil };
  main.innerHTML = "";
  await (fns[seccionActual] || renderInicio)(main);
  document.getElementById("footer").innerHTML = "🌙 Onírico — "+({es:"hecho para aprender y practicar sueños lúcidos.",ca:"fet per aprendre i practicar somnis lúcids.",en:"made to learn and practice lucid dreaming."}[idioma]);
}

// --- INICIO ---

    <div style="padding-top:20px;display:flex;flex-direction:column;gap:18px;max-width:560px;">
      <span style="color:var(--rem-500);font-size:0.85rem;">${{es:"Ciencia del sueño · Práctica guiada",ca:"Ciència del son · Pràctica guiada",en:"Sleep science · Guided practice"}[idioma]}</span>
      <h1 class="font-display" style="font-size:2.4rem;line-height:1.15;margin:0;">${t("home.titulo")}</h1>
      <p style="color:var(--niebla-300);font-size:1.05rem;line-height:1.5;">${t("home.subtitulo")}</p>

        <button class="btn" id="cta1">${usuarioActual? t("nav.diario") : t("home.cta")}</button>
        <button class="btn-secundario" id="cta2">${t("home.cta2")}</button>
      </div>
    </div>`;

}

 {titulo:"What are lucid dreams?",resumen:"The basics: realizing you're dreaming while the dream continues.",texto:"A lucid dream is one in which the person realizes they are dreaming while the dream is still happening. Some people are also able to voluntarily influence what happens from that moment on, although the degree of control varies a lot from person to person and from night to night. You don't need to control the dream for it to count as lucid: being aware that it is one is enough."},
 {titulo:"How does sleep work?",resumen:"A quick look at the stages the brain goes through each night.",texto:"Sleep is organized into cycles of about 90 minutes that repeat several times a night. Each cycle goes through stages of light sleep, deep sleep and REM sleep. As the night goes on, REM periods get longer, which explains why the most vivid dreams tend to concentrate in the second half of the night."},
 {titulo:"What is REM sleep?",resumen:"The stage linked to the most vivid, story-like dreams.",texto:"REM stands for 'Rapid Eye Movement'. It is the sleep stage in which brain activity resembles wakefulness, the eyes move rapidly under the eyelids and the body enters a kind of temporary paralysis. Most of the dreams we remember in detail come from this stage."},
 {titulo:"When do lucid dreams usually happen?",resumen:"Almost always during REM sleep, toward the end of the night.",texto:"Lucid dreams occur mostly during REM stages, which become longer and more frequent in the last hours of sleep. That's why many techniques, like WBTB, take advantage of precisely that final stretch of the night."},
 {titulo:"How can I improve my dream recall?",resumen:"The habit that supports everything else.",texto:"Staying still upon waking, mentally reconstructing the dream before moving and writing it down right away are the best-supported strategies for improving recall. With consistency, the number and level of detail of the dreams you remember usually increases noticeably within a few weeks."},
 {titulo:"What are recurring dreams?",resumen:"When the same scene, theme or emotion comes back again and again.",texto:"These are dreams that repeat with similar content, setting or emotion over time. They are often related to current worries or life situations, and they can become very reliable dream signs for recognizing that you're dreaming."},

  r:{es:"Lo que se sugiere, lo que se sabe y lo que conviene vigilar.",ca:"El que se suggereix, el que se sap i el que convé vigilar.",en:"What is suggested, what is known and what to watch for."},
  x:{es:"Posibles beneficios: más confianza e imaginación y el trabajo con pesadillas recurrentes; la investigación sobre efectos terapéuticos (ansiedad, estrés) todavía es limitada y no debe presentarse como garantía. Riesgos: algunas personas refieren dificultad para distinguir sueño y realidad, confusión, pérdida de sueño, parálisis del sueño, ansiedad o más pesadillas. Si practicas técnicas que interrumpen el sueño y notas cansancio o malestar, prioriza dormir bien. Si tienes algún trastorno del sueño o de salud mental, consúltalo antes con un profesional.",
     ca:"Possibles beneficis: més confiança i imaginació i el treball amb malsons recurrents; la recerca sobre efectes terapèutics (ansietat, estrès) encara és limitada i no s'ha de presentar com a garantia. Riscos: algunes persones refereixen dificultat per distingir somni i realitat, confusió, pèrdua de son, paràlisi del son, ansietat o més malsons. Si practiques tècniques que interrompen el son i notes cansament o malestar, prioritza dormir bé. Si tens algun trastorn del son o de salut mental, consulta-ho abans amb un professional.",
     en:"Possible benefits: more confidence and imagination and working with recurring nightmares; research on therapeutic effects (anxiety, stress) is still limited and should not be presented as a guarantee. Risks: some people report difficulty telling dreams from reality, confusion, lost sleep, sleep paralysis, anxiety or more nightmares. If you practice techniques that interrupt sleep and feel tired or unwell, prioritize sleeping well. If you have a sleep or mental health condition, talk to a professional first."},
  f:"OpenSynaps; Psicología y Mente (webgrafía del TDR)"},
 {cat:"lucids",
  t:{es:"¿Hasta qué punto se puede controlar el sueño?",ca:"Fins a quin punt es pot controlar el somni?",en:"How far can you control the dream?"},
  r:{es:"Tener un objetivo concreto marca la diferencia.",ca:"Tenir un objectiu concret marca la diferència.",en:"Having a specific goal makes the difference."},
  x:{es:"Dentro de un sueño lúcido hay cierta libertad para actuar, pero ayuda mucho tener un objetivo concreto: si no sabes qué quieres hacer, es fácil que la lucidez se escape. Conviene plantearlo antes de dormir (por ejemplo: volar, atravesar una pared o explorar el mundo onírico). Hay distintos niveles de control: algunas cosas cuestan más o requieren práctica. En la encuesta de este trabajo, la respuesta más frecuente entre quienes habían tenido sueños lúcidos fue haber controlado solo algún elemento puntual (33,2 % de las 250 respuestas).",
     ca:"Dins d'un somni lúcid hi ha una certa llibertat per actuar, però ajuda molt tenir un objectiu concret: si no saps què vols fer, és fàcil que la lucidesa s'escapi. Convé plantejar-lo abans de dormir (per exemple: volar, travessar una paret o explorar el món oníric). Hi ha diferents nivells de control: algunes coses costen més o requereixen pràctica. A l'enquesta d'aquest treball, la resposta més freqüent entre qui havia tingut somnis lúcids va ser haver controlat només algun element puntual (33,2 % de les 250 respostes).",
     en:"Inside a lucid dream there is some freedom to act, but having a specific goal helps a lot: if you don't know what you want to do, lucidity easily slips away. It's best to set it before sleeping (for example: flying, walking through a wall or exploring the dream world). There are different levels of control: some things are harder or take practice. In this project's survey, the most common answer among people who had lucid dreams was having controlled only one specific element (33.2% of the 250 responses)."},
  f:"Enquesta del TDR (2026)"},
 {cat:"memoria",
  t:{es:"Memoria declarativa y no declarativa",ca:"Memòria declarativa i no declarativa",en:"Declarative and non-declarative memory"},
  r:{es:"Dos grandes tipos de memoria y su relación con el sueño.",ca:"Dos grans tipus de memòria i la seva relació amb el son.",en:"Two main types of memory and their link to sleep."},
  x:{es:"El estudio del paciente Henry Molaison (H.M.), que no podía formar nuevos recuerdos tras una intervención cerebral, permitió distinguir dos tipos de memoria. La declarativa (explícita) se puede expresar con palabras: hechos y episodios. Endel Tulving (1972) la dividió en semántica (conceptos y conocimiento del mundo: «saber») y episódica (experiencias personales con tiempo y lugar: «recordar»). La no declarativa (implícita) es automática e inconsciente: memoria procedimental, condicionamiento clásico y priming. Se suele relacionar el sueño NREM con la consolidación de la memoria declarativa y el REM con la no declarativa.",
     ca:"L'estudi del pacient Henry Molaison (H.M.), que no podia formar nous records després d'una intervenció cerebral, va permetre distingir dos tipus de memòria. La declarativa (explícita) es pot expressar amb paraules: fets i episodis. Endel Tulving (1972) la va dividir en semàntica (conceptes i coneixement del món: «saber») i episòdica (experiències personals amb temps i lloc: «recordar»). La no declarativa (implícita) és automàtica i inconscient: memòria procedimental, condicionament clàssic i priming. Se sol relacionar el son NREM amb la consolidació de la memòria declarativa i el REM amb la no declarativa.",
     en:"The study of patient Henry Molaison (H.M.), who could not form new memories after brain surgery, made it possible to distinguish two types of memory. Declarative (explicit) memory can be put into words: facts and episodes. Endel Tulving (1972) divided it into semantic (concepts and world knowledge: «knowing») and episodic (personal experiences with time and place: «remembering»). Non-declarative (implicit) memory is automatic and unconscious: procedural memory, classical conditioning and priming. NREM sleep is usually linked to consolidating declarative memory and REM to non-declarative memory."},
  f:"Tulving (1972); NeuroClass; CISNe"},
 {cat:"memoria",
  t:{es:"Dormir poco: memoria y limpieza del cerebro",ca:"Dormir poc: memòria i neteja del cervell",en:"Too little sleep: memory and brain cleaning"},
  r:{es:"Por qué dormir bien es la base de todo lo demás.",ca:"Per què dormir bé és la base de tota la resta.",en:"Why sleeping well is the foundation of everything else."},
  x:{es:"La falta de sueño, el insomnio o la apnea del sueño dificultan la consolidación de la memoria: aparecen olvidos frecuentes, problemas para aprender habilidades nuevas y menor concentración. Además, el equipo de Maiken Nedergaard (Universidad de Rochester) describió que durante el sueño se movilizan los líquidos del cerebro y se eliminan residuos acumulados (sistema glinfático), como la proteína beta-amiloide, relacionada con el Alzheimer. Algunos estudios asocian la falta de sueño con más placas de amiloide. Por eso, ninguna técnica de sueños lúcidos debería quitarte horas de descanso.",
     ca:"La falta de son, l'insomni o l'apnea del son dificulten la consolidació de la memòria: apareixen oblits freqüents, problemes per aprendre habilitats noves i menys concentració. A més, l'equip de Maiken Nedergaard (Universitat de Rochester) va descriure que durant el son es mobilitzen els líquids del cervell i s'eliminen residus acumulats (sistema glinfàtic), com la proteïna beta-amiloide, relacionada amb l'Alzheimer. Alguns estudis associen la falta de son amb més plaques d'amiloide. Per això, cap tècnica de somnis lúcids hauria de treure't hores de descans.",
     en:"Lack of sleep, insomnia or sleep apnea make memory consolidation harder: frequent forgetting, trouble learning new skills and poorer concentration. In addition, Maiken Nedergaard's team (University of Rochester) described how, during sleep, brain fluids are mobilized and accumulated waste is cleared (the glymphatic system), such as beta-amyloid protein, linked to Alzheimer's. Some studies associate sleep loss with more amyloid plaques. That's why no lucid dreaming technique should cost you hours of rest."},
  f:"PNI España (De la Serna, 2025); Banner Health"},
 {cat:"somnis",
  t:{es:"¿Por qué olvidamos la mayoría de los sueños?",ca:"Per què oblidem la majoria dels somnis?",en:"Why do we forget most dreams?"},
  r:{es:"Recordar depende, sobre todo, de cuándo te despiertas.",ca:"Recordar depèn, sobretot, de quan et despertes.",en:"Recall depends mostly on when you wake up."},
  x:{es:"Se suele decir que olvidamos la gran mayoría de lo soñado (a menudo se cita un 95 %), aunque hay personas que lo recuerdan con todo detalle. Recordar está relacionado con los despertares: si te despiertas durante o justo después de una fase REM, es mucho más probable que recuerdes el sueño. También se asocian a más recuerdo el estrés o la ansiedad elevados, algunos trastornos del sueño, ciertos fármacos que alteran el REM y el alcohol. Recordar mucho no es malo en sí, pero puede indicar un sueño poco continuo.",
     ca:"Se sol dir que oblidem la gran majoria del que somiem (sovint se cita un 95 %), tot i que hi ha persones que ho recorden amb tot detall. Recordar està relacionat amb els despertars: si et despertes durant o just després d'una fase REM, és molt més probable que recordis el somni. També s'associen a més record l'estrès o l'ansietat elevats, alguns trastorns del son, certs fàrmacs que alteren el REM i l'alcohol. Recordar molt no és dolent en si mateix, però pot indicar un son poc continu.",
     en:"It is often said that we forget the vast majority of what we dream (a figure of 95% is often quoted), although some people remember it in great detail. Recall is linked to awakenings: if you wake up during or right after a REM stage, you are much more likely to remember the dream. High stress or anxiety, some sleep disorders, certain drugs that alter REM and alcohol are also associated with more recall. Remembering a lot isn't bad in itself, but it may indicate fragmented sleep."},
  f:"Instituto de Medicina del Sueño; Campayo"},
 {cat:"psicologia",
  t:{es:"Freud y Jung: dos maneras de leer los sueños",ca:"Freud i Jung: dues maneres de llegir els somnis",en:"Freud and Jung: two ways of reading dreams"},
  r:{es:"Del deseo reprimido al lenguaje de los símbolos.",ca:"Del desig reprimit al llenguatge dels símbols.",en:"From repressed desire to the language of symbols."},
  x:{es:"Los sueños se han estudiado desde la psicología como un fenómeno ligado a la actividad cerebral durante el sueño, influido por experiencias, emociones, recuerdos y preocupaciones, aunque no existe una explicación única de su función. En 1900, Sigmund Freud publicó «La interpretación de los sueños»: para él, los sueños expresaban de forma simbólica deseos y conflictos inconscientes, y disfrazaban su verdadero contenido. Carl Jung pensaba lo contrario: los sueños no ocultan nada, sino que expresan ideas profundas con un lenguaje propio de metáforas y símbolos que la mente racional no comprende del todo.",
     ca:"Els somnis s'han estudiat des de la psicologia com un fenomen lligat a l'activitat cerebral durant el son, influït per experiències, emocions, records i preocupacions, tot i que no existeix una explicació única de la seva funció. L'any 1900, Sigmund Freud va publicar «La interpretació dels somnis»: per a ell, els somnis expressaven de manera simbòlica desitjos i conflictes inconscients, i dissimulaven el seu veritable contingut. Carl Jung pensava el contrari: els somnis no amaguen res, sinó que expressen idees profundes amb un llenguatge propi de metàfores i símbols que la ment racional no comprèn del tot.",
     en:"Psychology has studied dreams as a phenomenon linked to brain activity during sleep, influenced by experiences, emotions, memories and worries, although there is no single explanation of their function. In 1900, Sigmund Freud published «The Interpretation of Dreams»: for him, dreams symbolically expressed unconscious desires and conflicts, and disguised their true content. Carl Jung thought the opposite: dreams hide nothing, but express deep ideas in their own language of metaphors and symbols that the rational mind can't fully grasp."},
  f:"Psicología y Mente (Ulloa Quevedo, 2025)"},
 {cat:"substancies",
  t:{es:"Sustancias y sueño: el alcohol",ca:"Substàncies i son: l'alcohol",en:"Substances and sleep: alcohol"},
  r:{es:"Sedar no es lo mismo que dormir.",ca:"Sedar no és el mateix que dormir.",en:"Sedation is not the same as sleep."},
  x:{es:"Las sustancias no actúan todas igual: se agrupan en depresoras (como el alcohol), estimulantes (nicotina, cafeína, cocaína) y perturbadoras (LSD, drogas de síntesis); algunas, como el cannabis, encajan en más de un grupo. El alcohol es un sedante: ayuda a perder la consciencia antes, pero no equivale al sueño natural. Fragmenta el descanso, provoca más despertares, reduce las fases profundas y bloquea el REM, lo que afecta a la consolidación de la memoria, las emociones y el ánimo del día siguiente. Este apartado es informativo, no una recomendación de consumo.",
     ca:"Les substàncies no actuen totes igual: s'agrupen en depressores (com l'alcohol), estimulants (nicotina, cafeïna, cocaïna) i pertorbadores (LSD, drogues de síntesi); algunes, com el cànnabis, encaixen en més d'un grup. L'alcohol és un sedant: ajuda a perdre la consciència abans, però no equival al son natural. Fragmenta el descans, provoca més despertars, redueix les fases profundes i bloqueja el REM, cosa que afecta la consolidació de la memòria, les emocions i l'ànim del dia següent. Aquest apartat és informatiu, no una recomanació de consum.",
     en:"Substances don't all act the same way: they are grouped into depressants (such as alcohol), stimulants (nicotine, caffeine, cocaine) and disruptors (LSD, synthetic drugs); some, like cannabis, fit in more than one group. Alcohol is a sedative: it helps you lose consciousness sooner, but it is not equivalent to natural sleep. It fragments rest, causes more awakenings, reduces deep stages and blocks REM, affecting memory consolidation, emotions and next-day mood. This section is informational, not a recommendation to use."},
  f:"Umivale Activa; Quirónsalud"},
 {cat:"substancies",
  t:{es:"Sustancias y sueño: el cannabis",ca:"Substàncies i son: el cànnabis",en:"Substances and sleep: cannabis"},
  r:{es:"Menos REM, y sueños más intensos al dejarlo.",ca:"Menys REM, i somnis més intensos en deixar-lo.",en:"Less REM, and more intense dreams after stopping."},
  x:{es:"El THC, el principal componente psicoactivo del cannabis, inhibe el sueño REM. Por eso muchas personas que consumen con frecuencia dicen soñar menos y, al dejarlo, tienen sueños muy vívidos e intensos. Un estudio de 2008 publicado en la revista Sleep sugiere que quienes consumen mucho pasan menos tiempo en REM. Usar cannabis como somnífero no tiene una base científica sólida y conlleva riesgo de tolerancia y adicción; el CBD se investiga con fines terapéuticos, pero tampoco está libre de efectos secundarios como sequedad de boca o fatiga.",
     ca:"El THC, el principal component psicoactiu del cànnabis, inhibeix el son REM. Per això moltes persones que en consumeixen amb freqüència diuen somiar menys i, en deixar-ho, tenen somnis molt vívids i intensos. Un estudi de 2008 publicat a la revista Sleep suggereix que qui en consumeix molt passa menys temps en REM. Usar el cànnabis com a somnífer no té una base científica sòlida i comporta risc de tolerància i addicció; el CBD s'investiga amb finalitats terapèutiques, però tampoc està exempt d'efectes secundaris com sequedat de boca o fatiga.",
     en:"THC, the main psychoactive component of cannabis, inhibits REM sleep. That's why many frequent users say they dream less and, when they quit, have very vivid and intense dreams. A 2008 study published in the journal Sleep suggests that heavy users spend less time in REM. Using cannabis as a sleeping aid has no solid scientific basis and carries a risk of tolerance and addiction; CBD is being studied for therapeutic uses, but it is not free of side effects such as dry mouth or fatigue."},
  f:"Royal Queen Seeds (Voser, 2023); Umivale Activa"},
 {cat:"substancies",
  t:{es:"Sustancias y sueño: nicotina y cafeína",ca:"Substàncies i son: nicotina i cafeïna",en:"Substances and sleep: nicotine and caffeine"},
  r:{es:"Dos estimulantes cotidianos que pesan en el descanso.",ca:"Dos estimulants quotidians que pesen en el descans.",en:"Two everyday stimulants that weigh on rest."},
  x:{es:"La nicotina es un estimulante: entre cigarrillos baja su nivel en el cuerpo (cada 1–3 horas) y la abstinencia puede provocar despertares continuos; además reduce el sueño profundo y el REM y se asocia a más ronquidos y apnea. La cafeína no da energía como tal: bloquea los receptores de adenosina, que señalan cansancio. Empieza a actuar a los 30 minutos, sus efectos pueden durar hasta 4 horas y se necesitan al menos 6 horas para eliminar la mitad de la consumida. Puede causar insomnio, somnolencia diurna y menos sueño profundo.",
     ca:"La nicotina és un estimulant: entre cigarretes baixa el seu nivell al cos (cada 1–3 hores) i l'abstinència pot provocar despertars continus; a més redueix el son profund i el REM i s'associa a més roncs i apnea. La cafeïna no dóna energia com a tal: bloqueja els receptors d'adenosina, que assenyalen cansament. Comença a actuar als 30 minuts, els seus efectes poden durar fins a 4 hores i calen almenys 6 hores per eliminar la meitat de la consumida. Pot causar insomni, somnolència diürna i menys son profund.",
     en:"Nicotine is a stimulant: between cigarettes its level in the body drops (every 1–3 hours) and withdrawal can cause repeated awakenings; it also reduces deep sleep and REM and is associated with more snoring and apnea. Caffeine doesn't give energy as such: it blocks adenosine receptors, which signal tiredness. It starts working after 30 minutes, its effects can last up to 4 hours and it takes at least 6 hours to eliminate half of what was consumed. It can cause insomnia, daytime sleepiness and less deep sleep."},
  f:"Quirónsalud (Dr. Estivill); Umivale Activa"},
 {cat:"substancies",
  t:{es:"Sustancias y sueño: otras drogas",ca:"Substàncies i son: altres drogues",en:"Substances and sleep: other drugs"},
  r:{es:"Estimulantes y depresoras también alteran el REM.",ca:"Estimulants i depressores també alteren el REM.",en:"Stimulants and depressants also alter REM."},
  x:{es:"Las drogas estimulantes (cocaína, anfetaminas, metanfetamina, éxtasis) dificultan conciliar el sueño, reducen el REM y dejan a las personas agotadas física y mentalmente. Las depresoras (opiáceos como la heroína o la morfina, y benzodiazepinas) pueden dar somnolencia, pero a largo plazo empeoran la calidad del sueño, lo fragmentan y reducen el REM. Ninguna de las fuentes consultadas permite afirmar que el consumo de una sustancia provoque sueños lúcidos: pueden cambiar la intensidad, el recuerdo o el contenido de los sueños sin aumentar la lucidez. Si tienes dudas sobre el consumo, consulta con un profesional sanitario.",
     ca:"Les drogues estimulants (cocaïna, amfetamines, metamfetamina, èxtasi) dificulten agafar el son, redueixen el REM i deixen les persones esgotades física i mentalment. Les depressores (opiacis com l'heroïna o la morfina, i benzodiazepines) poden donar somnolència, però a llarg termini empitjoren la qualitat del son, el fragmenten i redueixen el REM. Cap de les fonts consultades permet afirmar que el consum d'una substància provoqui somnis lúcids: poden canviar la intensitat, el record o el contingut dels somnis sense augmentar la lucidesa. Si tens dubtes sobre el consum, consulta amb un professional sanitari.",
     en:"Stimulant drugs (cocaine, amphetamines, methamphetamine, ecstasy) make it hard to fall asleep, reduce REM and leave people physically and mentally exhausted. Depressants (opiates such as heroin or morphine, and benzodiazepines) can cause drowsiness, but in the long run they worsen sleep quality, fragment it and reduce REM. None of the sources consulted allows us to claim that using a substance causes lucid dreams: they can change the intensity, recall or content of dreams without increasing lucidity. If you have doubts about substance use, consult a health professional."},
  f:"Adictalia; Centro Desintoxicación Valencia"},
 {cat:"treball",
  t:{es:"Mi encuesta: qué respondieron 250 personas",ca:"La meva enquesta: què van respondre 250 persones",en:"My survey: what 250 people answered"},
  r:{es:"Datos reales de la investigación detrás de esta app.",ca:"Dades reals de la recerca darrere d'aquesta app.",en:"Real data from the research behind this app."},
  x:{es:"Para este trabajo de investigación se hizo una encuesta anónima con 250 respuestas. La muestra es muy joven: el 63,2 % tenía menos de 15 años y el 29,6 %, entre 15 y 17. El 54 % dijo haber tenido algún sueño lúcido (19,2 % no y 26,8 % no estaba seguro), y un 40 % no había oído hablar de ellos antes. Solo un 10 % notó cambios en sus sueños tras consumir alguna sustancia: los más citados fueron sueños más extraños, más pesadillas y menos facilidad para recordar; solo 3 personas mencionaron más sueños lúcidos y 5, menos. Es compatible con la idea de que las sustancias modifican la experiencia del sueño sin aumentar la lucidez, aunque la muestra es pequeña y joven para confirmarlo.",
     ca:"Per a aquest treball de recerca es va fer una enquesta anònima amb 250 respostes. La mostra és molt jove: el 63,2 % tenia menys de 15 anys i el 29,6 %, entre 15 i 17. El 54 % va dir haver tingut algun somni lúcid (19,2 % no i 26,8 % no n'estava segur), i un 40 % no n'havia sentit a parlar abans. Només un 10 % va notar canvis en els seus somnis després de consumir alguna substància: els més citats van ser somnis més estranys, més malsons i menys facilitat per recordar; només 3 persones van esmentar més somnis lúcids i 5, menys. És compatible amb la idea que les substàncies modifiquen l'experiència del son sense augmentar la lucidesa, tot i que la mostra és petita i jove per confirmar-ho.",
     en:"For this research project, an anonymous survey with 250 responses was carried out. The sample is very young: 63.2% were under 15 and 29.6% were 15–17. 54% said they had had a lucid dream (19.2% no and 26.8% not sure), and 40% had never heard of them before. Only 10% noticed changes in their dreams after using a substance: the most cited were stranger dreams, more nightmares and less ease of recall; only 3 people mentioned more lucid dreams and 5 fewer. This is compatible with the idea that substances change the dream experience without increasing lucidity, although the sample is too small and young to confirm it."},
  f:"Enquesta del TDR (2026)"}
];

let catEdu = "todas", busquedaEdu = "";

async function renderEducacion(main){
  const olds = (ARTICULOS_POR_IDIOMA[idioma] || ARTICULOS_POR_IDIOMA.es).map((a,i)=>({cat:CAT_VIEJOS[i]||"lucids", titulo:a.titulo, resumen:a.resumen, texto:a.texto, font:""}));
  const news = ARTICULOS_NUEVOS.map(a=>({cat:a.cat, titulo:pick(a.t), resumen:pick(a.r), texto:pick(a.x), font:a.f||""}));
  const orden = Object.keys(CATS_EDU);
  const todos = [...olds, ...news].sort((a,b)=> orden.indexOf(a.cat)-orden.indexOf(b.cat));
  const L = {buscar:{es:"Buscar en los artículos...",ca:"Cerca als articles...",en:"Search the articles..."},
    todas:{es:"Todos",ca:"Tots",en:"All"}, fuente:{es:"Fuente",ca:"Font",en:"Source"},
    nada:{es:"No hay artículos con esa búsqueda.",ca:"No hi ha articles amb aquesta cerca.",en:"No articles match your search."},
    arts:{es:"artículos",ca:"articles",en:"articles"}};

  main.innerHTML = `<div class="seccion"><header><h1 class="font-display" style="font-size:1.9rem;margin:0 0 8px;">${t("educacion.titulo")}</h1>
  <p style="color:var(--niebla-300);line-height:1.6;">${t("educacion.intro")}</p></header>
  <div class="filtros" id="filtros-edu"></div>
  <input id="buscar-edu" placeholder="${pick(L.buscar)}" value="${busquedaEdu.replace(/"/g,"&quot;")}" style="max-width:420px;">
  <p id="contador-edu" style="color:var(--niebla-500);font-size:0.8rem;margin:0;"></p>
  <div id="lista-articulos"></div></div>`;

  const filtros = main.querySelector("#filtros-edu");
  [["todas",L.todas], ...Object.entries(CATS_EDU)].forEach(([clave,label])=>{
    const b = document.createElement("button"); b.className="filtro"+(catEdu===clave?" activo":"");
    b.textContent = pick(label);
    b.onclick = ()=>{ catEdu = clave; filtros.querySelectorAll(".filtro").forEach(x=>x.classList.remove("activo")); b.classList.add("activo"); pintarLista(); };
    filtros.appendChild(b);
  });
  main.querySelector("#buscar-edu").oninput = (e)=>{ busquedaEdu = e.target.value; pintarLista(); };

  function pintarLista(){
    const cont = main.querySelector("#lista-articulos"); cont.innerHTML = "";
    const q = busquedaEdu.trim().toLowerCase();
    const lista = todos.filter(a=> (catEdu==="todas"||a.cat===catEdu) && (!q || (a.titulo+" "+a.resumen+" "+a.texto).toLowerCase().includes(q)));
    main.querySelector("#contador-edu").textContent = `${lista.length} ${pick(L.arts)}`;
    if(lista.length===0){ cont.innerHTML = `<p style="color:var(--niebla-500);text-align:center;margin-top:20px;">${pick(L.nada)}</p>`; return; }
    const tarjeta = document.createElement("div"); tarjeta.className = "tarjeta";
    lista.forEach(a=>{
      const div = document.createElement("div"); div.className = "articulo";
      div.innerHTML = `<div class="articulo-header"><div>
          <span class="categoria-tag" style="display:inline-block;margin-bottom:6px;">${pick(CATS_EDU[a.cat])}</span>
          <h3 style="margin:0;font-size:1rem;color:var(--niebla-100);">${a.titulo}</h3>
          <p style="color:var(--niebla-500);font-size:0.85rem;margin:4px 0 0;">${a.resumen}</p></div>
          <span class="signo" style="color:var(--aurora-400);font-size:1.2rem;flex-shrink:0;">+</span></div>
        <div class="oculto cuerpo-art"><p style="color:var(--niebla-300);line-height:1.65;margin:12px 0 0;font-size:0.9rem;">${a.texto}</p>
        ${a.font?`<p style="color:var(--niebla-500);font-size:0.75rem;margin:8px 0 0;">${pick(L.fuente)}: ${a.font}</p>`:""}</div>`;
      div.querySelector(".articulo-header").onclick = ()=>{
        const c = div.querySelector(".cuerpo-art"); c.classList.toggle("oculto");
        div.querySelector(".signo").textContent = c.classList.contains("oculto")?"+":"−";
      };
      tarjeta.appendChild(div);
    });
    cont.appendChild(tarjeta);
  }
  pintarLista();
}

async function renderDiario(main){
  main.innerHTML = `<div class="seccion"><header style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;">

  main.querySelector("#btn-nuevo").onclick = ()=> mostrarForm();

  function mostrarForm(sueno){
    const cont = main.querySelector("#form-cont");
    const hoy = new Date().toISOString().slice(0,10);
    cont.innerHTML = `<div class="tarjeta">
      <div class="campo"><label>${t("diario.fecha")}</label><input type="date" id="f-fecha" value="${sueno?new Date(sueno.fecha).toISOString().slice(0,10):hoy}"></div>

      <div class="campo"><label>${t("diario.nivel")}: <span id="f-val" style="color:var(--luna-500);font-weight:700;">${sueno?sueno.nivelLucidez:0}</span></label><input type="range" min="0" max="5" id="f-nivel" value="${sueno?sueno.nivelLucidez:0}" style="accent-color:var(--aurora-500);"></div>
      <div class="campo"><label>${t("diario.senales")}</label><input id="f-senales" value="${sueno?(sueno.senalesOniricas||[]).join(", "):""}"></div>
      <div style="display:flex;gap:10px;"><button class="btn" id="f-guardar" style="flex:1;">${sueno?t("diario.actualizar"):t("diario.guardar")}</button><button class="btn-secundario" id="f-cancelar">${t("diario.cancelar")}</button></div>
    </div>`;
    cont.querySelector("#f-nivel").oninput=(e)=> cont.querySelector("#f-val").textContent=e.target.value;
    cont.querySelector("#f-cancelar").onclick=()=> cont.innerHTML="";
    cont.querySelector("#f-guardar").onclick = async ()=>{
      const body = { fecha:cont.querySelector("#f-fecha").value, texto:cont.querySelector("#f-texto").value,
        nivelLucidez:Number(cont.querySelector("#f-nivel").value), senalesOniricas:cont.querySelector("#f-senales").value.split(",").map(s=>s.trim()).filter(Boolean) };
      if(!body.texto.trim()) return;
      if(sueno) await api(`/api/suenos/${sueno._id}`,{method:"PUT",body:JSON.stringify(body)});
      else await api("/api/suenos",{method:"POST",body:JSON.stringify(body)});
      irA("diario");
    };
  }

  const {suenos} = await api("/api/suenos");
  const listaDiv = main.querySelector("#lista-cont");
  if(suenos.length===0){ listaDiv.innerHTML = `<p style="color:var(--niebla-500);text-align:center;margin-top:20px;">${t("diario.vacio")}</p>`; return; }
  listaDiv.style.display="flex"; listaDiv.style.flexDirection="column"; listaDiv.style.gap="14px";
  suenos.forEach(sueno=>{
    const art = document.createElement("div"); art.className="sueno-tarjeta";
    art.innerHTML = `<div class="sueno-header"><span>${new Date(sueno.fecha).toLocaleDateString()}</span><span class="pill">${t("diario.nivel")}: ${sueno.nivelLucidez}/5</span></div>
    <p style="white-space:pre-line;margin:0;">${sueno.texto}</p>
    <div>${(sueno.senalesOniricas||[]).map(s=>`<span class="senal">${s}</span>`).join("")}</div>
    <div style="display:flex;gap:16px;margin-top:12px;"><button class="btn-peligro" style="color:var(--rem-500);" data-a="editar">${t("diario.editar")}</button><button class="btn-peligro" data-a="borrar">${t("diario.borrar")}</button></div>`;
    art.querySelector('[data-a="editar"]').onclick=()=>mostrarForm(sueno);
    art.querySelector('[data-a="borrar"]').onclick=async()=>{ await api(`/api/suenos/${sueno._id}`,{method:"DELETE"}); irA("diario"); };
    listaDiv.appendChild(art);
  });
}

// --- COMUNIDAD (chat en tiempo real) ---
const CATEGORIAS_COMUNIDAD = {
  es: ["General","Primer sueño lúcido","Técnicas","Pesadillas","WBTB","MILD","SSILD","Experiencias","Consejos"],
  ca: ["General","Primer somni lúcid","Tècniques","Malsons","WBTB","MILD","SSILD","Experiències","Consells"],
  en: ["General","First lucid dream","Techniques","Nightmares","WBTB","MILD","SSILD","Experiences","Tips"]
};
let mensajesComunidad = [];
let categoriaFiltro = "Todos";

function conectarSocket(){
  if(socket) return;
  socket = io();
  socket.on("mensaje_recibido", (msg)=>{
    mensajesComunidad.push(msg);
    if(seccionActual==="comunidad") pintarMensajes();
  });
  socket.on("mensaje_borrado", ({id})=>{
    mensajesComunidad = mensajesComunidad.filter(m=>m._id!==id);
    if(seccionActual==="comunidad") pintarMensajes();
  });
}
function pintarMensajes(){
  const cont = document.getElementById("chat-mensajes");
  if(!cont) return;
  cont.innerHTML = "";
  const lista = categoriaFiltro==="Todos" ? mensajesComunidad : mensajesComunidad.filter(m=>m.categoria===categoriaFiltro);
  lista.forEach(msg=>{
    const card = document.createElement("div"); card.className="post-tarjeta";
    card.innerHTML = `<div class="post-header">
        <span style="display:flex;align-items:center;gap:8px;font-size:0.85rem;color:var(--niebla-100);"><span style="font-size:1.1rem;">${msg.autorAvatar||"🌙"}</span> ${msg.autorNombre}</span>
        <span style="display:flex;align-items:center;gap:8px;">
          <span class="categoria-tag">${msg.categoria||"General"}</span>
          ${usuarioActual?.esAdmin?'<button class="btn-peligro" data-borrar style="font-size:0.9rem;">🗑️</button>':""}
        </span>
      </div>
      <p style="margin:0;color:var(--niebla-300);font-size:0.9rem;">${msg.texto}</p>`;
    if(usuarioActual?.esAdmin){
      card.querySelector("[data-borrar]").onclick = async ()=>{
        if(!confirm(idioma==="en"?"Delete this message?":idioma==="ca"?"Esborrar aquest missatge?":"¿Borrar este mensaje?")) return;
        await api(`/api/chat/${msg._id}`,{method:"DELETE"});
        mensajesComunidad = mensajesComunidad.filter(m=>m._id!==msg._id);
        pintarMensajes();
      };
    }
    cont.appendChild(card);
  });
  cont.scrollTop = cont.scrollHeight;
}
async function renderComunidad(main){
  const CATS = CATEGORIAS_COMUNIDAD[idioma] || CATEGORIAS_COMUNIDAD.es;
  const catTodos = {es:"Todos",ca:"Totes",en:"All"}[idioma];
  main.innerHTML = `<div class="seccion"><header><h1 class="font-display" style="font-size:1.9rem;margin:0 0 8px;">${t("comunidad.titulo")}</h1><p style="color:var(--niebla-300);">${t("comunidad.intro")}</p></header>
  <div class="filtros" id="filtros-cat"></div>
  <div class="tarjeta chat-caja"><div class="chat-mensajes" id="chat-mensajes"></div>
  <form class="chat-form" id="chat-form" style="flex-wrap:wrap;">
    <select id="chat-categoria" style="width:auto;flex:0 0 auto;">${CATS.map(c=>`<option value="${c}">${c}</option>`).join("")}</select>
    <input id="chat-input" placeholder="${t("comunidad.placeholder")}" style="flex:1;min-width:120px;">
    <button class="btn" type="submit">${t("comunidad.enviar")}</button>
  </form></div></div>`;

  const filtrosDiv = main.querySelector("#filtros-cat");
  ["Todos", ...CATS].forEach((c,i)=>{
    const b = document.createElement("button"); b.className="filtro"+((c==="Todos"&&categoriaFiltro==="Todos")||c===categoriaFiltro?" activo":"");
    b.textContent = i===0?catTodos:c;
    b.onclick = ()=>{ categoriaFiltro = c==="Todos"?"Todos":c; main.querySelectorAll(".filtro").forEach(x=>x.classList.remove("activo")); b.classList.add("activo"); pintarMensajes(); };
    filtrosDiv.appendChild(b);
  });

  conectarSocket();
  if(mensajesComunidad.length===0){
    const {mensajes} = await api("/api/chat/historial");
    mensajesComunidad = mensajes;
  }
  pintarMensajes();
  main.querySelector("#chat-form").onsubmit = (e)=>{
    e.preventDefault();
    const input = main.querySelector("#chat-input");
    const categoria = main.querySelector("#chat-categoria").value;
    if(!input.value.trim()) return;
    socket.emit("mensaje_nuevo", {texto:input.value, categoria});
    input.value = "";
  };
}

const AVATARES = ["🌙","⭐","🌌","🦋","🔮","🌊","🦉","🌠"];
async function renderPerfil(main){
  main.innerHTML = `<div style="max-width:460px;margin:0 auto;"><h1 class="font-display" style="font-size:1.9rem;">${t("perfil.titulo")}</h1>
  <div class="tarjeta" style="display:flex;gap:16px;align-items:center;margin-bottom:16px;">
    <div class="avatar-grande" id="avatar-preview">${usuarioActual.avatar||"🌙"}</div>
    <div><p style="margin:0;color:var(--niebla-100);font-weight:600;">${usuarioActual.nombre}</p><p style="margin:2px 0 0;color:var(--niebla-500);font-size:0.82rem;">${usuarioActual.email}</p></div>
  </div>
  <div class="tarjeta">
    <div class="campo"><label>${{es:"Elige tu avatar",ca:"Tria el teu avatar",en:"Choose your avatar"}[idioma]}</label>
      <div style="display:flex;gap:8px;flex-wrap:wrap;" id="selector-avatar"></div>
    </div>
    <div class="campo"><label>${t("perfil.nombre")}</label><input id="p-nombre" value="${usuarioActual.nombre}"></div>
    <div class="campo"><label>${{es:"Descripción",ca:"Descripció",en:"Bio"}[idioma]}</label><textarea id="p-desc" rows="3" maxlength="280" placeholder="${{es:"Cuenta algo sobre ti o tu experiencia con los sueños lúcidos...",ca:"Explica alguna cosa sobre tu o la teva experiència amb els somnis lúcids...",en:"Tell something about you or your lucid dreaming experience..."}[idioma]}">${usuarioActual.descripcion||""}</textarea></div>
    <div class="campo"><label>${t("perfil.idioma")}</label><select id="p-idioma"><option value="es">Español</option><option value="ca">Català</option><option value="en">English</option></select></div>
    <button class="btn" id="p-guardar" style="width:100%;">${t("perfil.guardar")}</button>
  </div>
  <div class="tarjeta" style="margin-top:16px;display:grid;grid-template-columns:1fr 1fr;gap:14px;text-align:center;">
    <div><div class="font-display" style="font-size:1.8rem;color:var(--aurora-400);">${usuarioActual.estadisticas.totalSuenosRegistrados}</div><div style="font-size:0.75rem;color:var(--niebla-500);">${t("perfil.totalSuenos")}</div></div>
    <div><div class="font-display" style="font-size:1.8rem;color:var(--luna-500);">${usuarioActual.estadisticas.totalSuenosLucidos}</div><div style="font-size:0.75rem;color:var(--niebla-500);">${t("perfil.totalLucidos")}</div></div>
  </div></div>`;
  main.querySelector("#p-idioma").value = usuarioActual.idiomaPreferido;

  let avatarElegido = usuarioActual.avatar || "🌙";
  const selector = main.querySelector("#selector-avatar");
  AVATARES.forEach(a=>{
    const b = document.createElement("button"); b.type="button"; b.className="avatar-opcion"+(a===avatarElegido?" activo":"");
    b.textContent = a;
    b.onclick = ()=>{ avatarElegido = a; main.querySelectorAll(".avatar-opcion").forEach(x=>x.classList.remove("activo")); b.classList.add("activo"); main.querySelector("#avatar-preview").textContent = a; };
    selector.appendChild(b);
  });

  main.querySelector("#p-guardar").onclick = async()=>{
    const r = await api("/api/auth/perfil",{method:"PUT",body:JSON.stringify({
      nombre:main.querySelector("#p-nombre").value,
      idiomaPreferido:main.querySelector("#p-idioma").value,
      avatar:avatarElegido,
      descripcion:main.querySelector("#p-desc").value
    })});
    usuarioActual = r.usuario; idioma = usuarioActual.idiomaPreferido; localStorage.setItem("onirico_idioma",idioma);
    render();
  };
}

// ---------------------------------------------------------------------------
// ARRANQUE
// ---------------------------------------------------------------------------
(async function(){
  iniciarEstrellas();
  await cargarSesion();
  if(usuarioActual) conectarSocket();
  render();
})();
</script>
</body>
</html>
