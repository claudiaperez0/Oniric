<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Onírico — Sueños lúcidos</title>
<script src="/socket.io/socket.io.js"></script>
<style>
  @import url("https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Sora:wght@400;500;600;700&display=swap");
  :root{
    --noche-950:#05060d; --noche-900:#0b0e1a; --noche-800:#141829; --noche-700:#1f2438; --noche-600:#2c3350;
    --aurora-400:#a99bf0; --aurora-500:#8b7fd6; --rem-500:#4fd1c5; --luna-500:#e8c97a;
    --niebla-100:#edeef5; --niebla-300:#c3c6d9; --niebla-500:#8a8fae;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--noche-950);color:var(--niebla-100);font-family:"Sora",system-ui,sans-serif;min-height:100vh;}
  h1,h2,h3,.font-display{font-family:"Fraunces",serif;}
  #estrellas{position:fixed;inset:0;z-index:-1;background:radial-gradient(circle at top, rgba(139,127,214,0.15), transparent 60%);}
  header{position:sticky;top:0;z-index:20;background:rgba(5,6,13,0.75);backdrop-filter:blur(6px);border-bottom:1px solid var(--noche-700);}
  .header-inner{max-width:1000px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;padding:14px 18px;flex-wrap:wrap;gap:10px;}
  .logo{font-family:"Fraunces",serif;font-size:1.2rem;}
  nav{display:flex;gap:6px;flex-wrap:wrap;}
  nav button{background:none;border:1px solid transparent;color:var(--niebla-300);padding:6px 12px;border-radius:999px;font-size:0.85rem;cursor:pointer;font-family:inherit;}
  nav button.activo{background:var(--aurora-500);color:var(--noche-950);font-weight:600;}
  nav button:not(.activo):hover{border-color:var(--aurora-500);color:var(--aurora-400);}
  .idiomas{display:flex;gap:2px;background:var(--noche-800);border:1px solid var(--noche-700);border-radius:999px;padding:3px;}
  .idiomas button{padding:4px 9px;font-size:0.72rem;border-radius:999px;border:none;background:none;color:var(--niebla-500);cursor:pointer;font-family:inherit;}
  .idiomas button.activo{background:var(--aurora-500);color:var(--noche-950);font-weight:700;}
  main{max-width:800px;margin:0 auto;padding:32px 18px 80px;}
  .seccion{display:flex;flex-direction:column;gap:22px;}
  .tarjeta{background:var(--noche-800);border:1px solid var(--noche-700);border-radius:14px;padding:22px;}
  .pill{display:inline-block;background:var(--noche-700);color:var(--luna-500);border-radius:999px;font-size:0.72rem;padding:3px 10px;}
  input,textarea,select{width:100%;background:var(--noche-900);border:1px solid var(--noche-700);border-radius:10px;padding:9px 12px;color:var(--niebla-100);font-family:inherit;font-size:0.92rem;}
  input:focus,textarea:focus,select:focus{outline:2px solid var(--aurora-500);border-color:var(--aurora-500);}
  label{font-size:0.82rem;color:var(--niebla-500);display:block;margin-bottom:5px;}
  .campo{margin-bottom:14px;}
  .btn{background:var(--aurora-500);color:var(--noche-950);font-weight:700;border:none;padding:10px 20px;border-radius:999px;cursor:pointer;font-family:inherit;font-size:0.92rem;}
  .btn:hover{background:var(--aurora-400);}
  .btn:disabled{opacity:0.6;cursor:default;}
  .btn-secundario{background:none;border:1px solid var(--noche-600);color:var(--niebla-300);padding:10px 18px;border-radius:999px;cursor:pointer;font-family:inherit;}
  .btn-secundario:hover{border-color:var(--niebla-500);}
  .btn-peligro{background:none;border:none;color:#f28b82;cursor:pointer;font-family:inherit;font-size:0.85rem;}
  .error{color:#f28b82;font-size:0.85rem;}
  .tecnica-header{display:flex;justify-content:space-between;align-items:center;cursor:pointer;}
  .tecnica-cuerpo{margin-top:16px;padding-top:16px;border-top:1px solid var(--noche-700);display:none;flex-direction:column;gap:12px;}
  .tecnica-cuerpo.abierta{display:flex;}
  .tecnica-cuerpo h4{color:var(--rem-500);font-size:0.82rem;margin:0 0 6px;}
  .tecnica-cuerpo p, .tecnica-cuerpo ol{color:var(--niebla-300);font-size:0.9rem;line-height:1.5;margin:0;}
  .sueno-tarjeta{background:var(--noche-800);border:1px solid var(--noche-700);border-radius:14px;padding:18px;}
  .sueno-header{display:flex;justify-content:space-between;font-size:0.8rem;color:var(--niebla-500);margin-bottom:8px;}
  .senal{display:inline-block;background:rgba(139,127,214,0.15);color:var(--aurora-400);border-radius:999px;font-size:0.72rem;padding:3px 10px;margin:3px 5px 0 0;}
  .habito{display:flex;align-items:center;justify-content:space-between;background:var(--noche-800);border:1px solid var(--noche-700);border-radius:14px;padding:14px 18px;}
  .habito label{display:flex;align-items:center;gap:12px;cursor:pointer;color:var(--niebla-100);font-size:0.95rem;margin:0;}
  .habito input[type=checkbox]{width:20px;height:20px;accent-color:var(--aurora-500);}
  .barra-fase{height:26px;border-radius:5px;display:inline-block;vertical-align:middle;}
  .leyenda{display:flex;gap:14px;flex-wrap:wrap;font-size:0.78rem;color:var(--niebla-500);margin-top:10px;}
  .leyenda span{display:inline-flex;align-items:center;gap:6px;}
  .cuadro{width:11px;height:11px;border-radius:3px;display:inline-block;}
  .zona{cursor:pointer;transition:fill-opacity 0.2s;}
  .chat-caja{display:flex;flex-direction:column;height:65vh;}
  .chat-mensajes{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding-right:4px;}
  .msg{max-width:80%;}
  .msg.mio{align-self:flex-end;text-align:right;}
  .msg .autor{font-size:0.72rem;color:var(--niebla-500);margin-bottom:2px;}
  .msg .globo{border-radius:16px;padding:8px 14px;font-size:0.9rem;display:inline-block;}
  .msg.mio .globo{background:var(--aurora-500);color:var(--noche-950);}
  .msg:not(.mio) .globo{background:var(--noche-700);}
  .chat-form{display:flex;gap:8px;margin-top:14px;border-top:1px solid var(--noche-700);padding-top:14px;}
  .chat-form input{border-radius:999px;flex:1;}
  footer{max-width:800px;margin:0 auto;padding:0 18px 40px;color:var(--niebla-500);font-size:0.78rem;}
  .oculto{display:none !important;}

  /* --- Insignias de evidencia científica --- */
  .badge{display:inline-flex;align-items:center;gap:6px;font-size:0.72rem;font-weight:600;padding:4px 10px;border-radius:999px;}
  .badge .punto{width:6px;height:6px;border-radius:50%;display:inline-block;}
  .aviso{display:flex;gap:10px;align-items:flex-start;background:rgba(232,201,122,0.12);border:1px solid rgba(232,201,122,0.3);border-radius:12px;padding:12px 14px;font-size:0.85rem;color:var(--niebla-100);}
  .filtros{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px;}
  .filtro{font-size:0.82rem;padding:6px 14px;border-radius:999px;cursor:pointer;font-family:inherit;border:1px solid var(--noche-700);background:var(--noche-800);color:var(--niebla-500);}
  .filtro.activo{background:var(--aurora-500);color:var(--noche-950);border-color:var(--aurora-500);font-weight:600;}
  .grid-tecnicas{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  @media(max-width:600px){.grid-tecnicas{grid-template-columns:1fr;}}
  .volver{display:inline-flex;align-items:center;gap:6px;color:var(--niebla-500);font-size:0.85rem;background:none;border:none;cursor:pointer;font-family:inherit;margin-bottom:14px;}
  .volver:hover{color:var(--niebla-100);}
  .avatar-grande{width:64px;height:64px;border-radius:50%;background:var(--noche-700);display:flex;align-items:center;justify-content:center;font-size:2rem;flex-shrink:0;}
  .avatar-opcion{font-size:1.5rem;width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:2px solid var(--noche-700);cursor:pointer;background:var(--noche-900);}
  .avatar-opcion.activo{border-color:var(--aurora-500);background:rgba(139,127,214,0.18);}
  .post-tarjeta{background:var(--noche-800);border:1px solid var(--noche-700);border-radius:14px;padding:16px 18px;}
  .post-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
  .categoria-tag{font-size:0.72rem;padding:3px 10px;border-radius:999px;background:rgba(139,127,214,0.15);color:var(--aurora-400);}
  .bloque-rutina{margin-bottom:8px;}
  .bloque-rutina h4{display:flex;align-items:center;gap:8px;font-size:0.85rem;color:var(--niebla-100);margin:0 0 10px;font-family:"Sora";font-weight:600;}
  .articulo{border-bottom:1px solid var(--noche-700);padding:14px 0;}
  .articulo:last-child{border-bottom:none;}
  .articulo-header{display:flex;justify-content:space-between;align-items:flex-start;cursor:pointer;gap:10px;}
</style>
</head>
<body>
<div id="estrellas"></div>
<header>
  <div class="header-inner">
    <div class="logo">🌙 Onírico</div>
    <nav id="nav"></nav>
    <div style="display:flex;align-items:center;gap:10px;">
      <div class="idiomas" id="idiomas"></div>
      <div id="zona-usuario"></div>
    </div>
  </div>
</header>
<main id="main"></main>
<footer id="footer"></footer>

<script>
/* =============================================================================
   ONÍRICO — frontend que habla con el backend real (server.js)
   Todas las llamadas usan fetch() con credentials:'include' para que la
   cookie de sesión (JWT) viaje en cada petición.
   ============================================================================= */

const API = ""; // mismo origen: el backend sirve este propio archivo

async function api(ruta, opciones={}){
  const resp = await fetch(API+ruta, {
    credentials:"include",
    headers:{ "Content-Type":"application/json", ...(opciones.headers||{}) },
    ...opciones
  });
  const datos = await resp.json().catch(()=>({}));
  if(!resp.ok) throw new Error(datos.error || "Error de conexión.");
  return datos;
}

// ---------------------------------------------------------------------------
// TRADUCCIONES
// ---------------------------------------------------------------------------
const TEXTOS = {

    diario:{titulo:"Tu diario de sueños",nuevo:"+ Nuevo sueño",fecha:"Fecha",texto:"Cuenta tu sueño",nivel:"Nivel de lucidez",senales:"Señales oníricas (separadas por comas)",guardar:"Guardar",actualizar:"Actualizar",cancelar:"Cancelar",vacio:"Todavía no has registrado ningún sueño.",editar:"Editar",borrar:"Borrar"},

    cerebro:{titulo:"El cerebro que sueña",intro:"Toca cada zona para descubrir su papel durante el sueño."},
    rutina:{titulo:"Tu rutina de práctica",intro:"Marca cada día las técnicas que practiques.",anadir:"Añadir"},
    perfil:{titulo:"Tu perfil",nombre:"Nombre",idioma:"Idioma",guardar:"Guardar",totalSuenos:"Sueños registrados",totalLucidos:"Sueños lúcidos"},
    comun:{racha:"días seguidos",cargando:"Cargando..."} },

  ca:{ nav:{inicio:"Inici",educacion:"Educació",tecnicas:"Tècniques",diario:"Diari",comunidad:"Comunitat",cerebro:"Cervell",rutina:"Rutina",perfil:"Perfil",login:"Inicia sessió",registro:"Crea un compte",salir:"Surt"},
    home:{titulo:"Aprèn a habitar els teus somnis",subtitulo:"Guia científica i pràctica per descobrir, entrenar i gaudir dels somnis lúcids, amb el teu progrés personal.",cta:"Crea un compte",cta2:"Veure la ciència"},
    auth:{email:"Correu electrònic",password:"Contrasenya",nombre:"Nom",entrar:"Entra",crear:"Crea un compte",yaCuenta:"Ja tinc compte",noCuenta:"Encara no tinc compte"},
    educacion:{titulo:"Què és un somni lúcid?",intro:"Un somni lúcid és, senzillament, un somni en què t'adones que estàs somiant mentre passa.",cerebroTitulo:"Què passa al cervell mentre somies?",cerebroTexto:"La majoria de somnis vívids passen en la fase REM. El cervell està molt actiu, gairebé com despert, mentre el cos roman paralitzat. En un somni lúcid augmenta l'activitat a l'escorça prefrontal, la zona del raonament i l'autoconsciència.",beneficiosTitulo:"Beneficis i riscos",beneficiosTexto:"Entre els beneficis: menys malsons recurrents, un espai segur per practicar habilitats, i l'experiència creativa d'explorar la teva pròpia ment. Amb moderació: algunes tècniques poden generar cansament si se n'abusa."},
    tecnicas:{titulo:"Tècniques d'inducció",intro:"Cinc mètodes amb suport científic. Toca cadascuna per desplegar-la."},
    diario:{titulo:"El teu diari de somnis",nuevo:"+ Nou somni",fecha:"Data",texto:"Explica el teu somni",nivel:"Nivell de lucidesa",senales:"Senyals oníriques (separades per comes)",guardar:"Desa",actualizar:"Actualitza",cancelar:"Cancel·la",vacio:"Encara no has registrat cap somni.",editar:"Edita",borrar:"Esborra"},
    comunidad:{titulo:"Comunitat",intro:"Comparteix les teves experiències en temps real.",placeholder:"Escriu un missatge...",enviar:"Envia"},
    cerebro:{titulo:"El cervell que somia",intro:"Toca cada zona per descobrir el seu paper durant el son."},
    rutina:{titulo:"La teva rutina de pràctica",intro:"Marca cada dia les tècniques que practiquis.",anadir:"Afegeix"},
    perfil:{titulo:"El teu perfil",nombre:"Nom",idioma:"Idioma",guardar:"Desa",totalSuenos:"Somnis registrats",totalLucidos:"Somnis lúcids"},
    comun:{racha:"dies seguits",cargando:"Carregant..."} },

  en:{ nav:{inicio:"Home",educacion:"Learn",tecnicas:"Techniques",diario:"Journal",comunidad:"Community",cerebro:"Brain",rutina:"Routine",perfil:"Profile",login:"Log in",registro:"Sign up",salir:"Log out"},
    home:{titulo:"Learn to inhabit your dreams",subtitulo:"A scientific, practical guide to discovering, training and enjoying lucid dreams, with your own personal progress.",cta:"Create account",cta2:"See the science"},
    auth:{email:"Email",password:"Password",nombre:"Name",entrar:"Log in",crear:"Create account",yaCuenta:"I already have an account",noCuenta:"I don't have an account yet"},
    educacion:{titulo:"What is a lucid dream?",intro:"A lucid dream is simply a dream in which you realize you're dreaming while it's happening.",cerebroTitulo:"What happens in the brain while you dream?",cerebroTexto:"Most vivid dreams happen during REM sleep. The brain is very active, almost as if awake, while the body stays paralyzed. During a lucid dream, activity increases in the prefrontal cortex, the area responsible for reasoning and self-awareness.",beneficiosTitulo:"Benefits and risks",beneficiosTexto:"Possible benefits include fewer recurring nightmares, a safe space to practice skills, and the creative experience of exploring your own mind. In moderation: some techniques can cause tiredness if overused."},
    tecnicas:{titulo:"Induction techniques",intro:"Five methods with scientific backing. Tap each one to expand it."},
    diario:{titulo:"Your dream journal",nuevo:"+ New dream",fecha:"Date",texto:"Tell your dream",nivel:"Lucidity level",senales:"Dream signs (comma separated)",guardar:"Save",actualizar:"Update",cancelar:"Cancel",vacio:"You haven't logged any dreams yet.",editar:"Edit",borrar:"Delete"},

    perfil:{titulo:"Your profile",nombre:"Name",idioma:"Language",guardar:"Save",totalSuenos:"Dreams logged",totalLucidos:"Lucid dreams"},

};

let idioma = localStorage.getItem("onirico_idioma") || "es";
function t(ruta){ let v=TEXTOS[idioma]; for(const p of ruta.split(".")) v=v?.[p]; return v??ruta; }

// ---------------------------------------------------------------------------
// ESTADO
// ---------------------------------------------------------------------------
let usuarioActual = null;
let seccionActual = "inicio";
let socket = null;

const SECCIONES_PUBLICAS = ["inicio","educacion","tecnicas","cerebro"];
const SECCIONES_PRIVADAS = ["diario","comunidad","rutina","perfil"];

async function cargarSesion(){
  try{ usuarioActual = (await api("/api/auth/yo")).usuario; }catch{ usuarioActual = null; }
}

function irA(sec){
  if(SECCIONES_PRIVADAS.includes(sec) && !usuarioActual){ seccionActual="login"; render(); return; }
  seccionActual = sec; render();
}

// ---------------------------------------------------------------------------
// FONDO DE ESTRELLAS
// ---------------------------------------------------------------------------
function iniciarEstrellas(){
  const cont = document.getElementById("estrellas");
  const canvas = document.createElement("canvas"); cont.appendChild(canvas);
  const ctx = canvas.getContext("2d");
  function ajustar(){ canvas.width=innerWidth; canvas.height=innerHeight; }
  ajustar(); addEventListener("resize", ajustar);
  const estrellas = Array.from({length:120},()=>({x:Math.random()*innerWidth,y:Math.random()*innerHeight,r:Math.random()*1.2+0.3,fase:Math.random()*Math.PI*2,vel:Math.random()*0.02+0.005}));
  function dibujar(tm){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    estrellas.forEach(e=>{ const b=0.4+0.6*Math.abs(Math.sin(e.fase+tm*e.vel)); ctx.beginPath(); ctx.arc(e.x,e.y,e.r,0,7); ctx.fillStyle=`rgba(237,238,245,${b})`; ctx.fill(); });
    requestAnimationFrame(dibujar);
  }
  requestAnimationFrame(dibujar);
}

// ---------------------------------------------------------------------------
// NAV
// ---------------------------------------------------------------------------
function renderNav(){
  const nav = document.getElementById("nav");
  nav.innerHTML = "";
  const secciones = usuarioActual ? [...SECCIONES_PUBLICAS,...SECCIONES_PRIVADAS] : SECCIONES_PUBLICAS;
  secciones.forEach(sec=>{
    const b=document.createElement("button");
    b.textContent = t(`nav.${sec}`); if(sec===seccionActual) b.classList.add("activo");
    b.onclick=()=>irA(sec); nav.appendChild(b);
  });
  const idiomasDiv = document.getElementById("idiomas"); idiomasDiv.innerHTML="";
  ["es","ca","en"].forEach(c=>{
    const b=document.createElement("button"); b.textContent=c.toUpperCase();
    if(c===idioma) b.classList.add("activo");
    b.onclick=()=>{ idioma=c; localStorage.setItem("onirico_idioma",c); render(); };
    idiomasDiv.appendChild(b);
  });
  const zonaUsuario = document.getElementById("zona-usuario");
  if(usuarioActual){
    zonaUsuario.innerHTML = `<button class="btn-secundario" id="btn-salir" style="padding:6px 14px;">${t("nav.salir")}</button>`;
    zonaUsuario.querySelector("#btn-salir").onclick = async ()=>{ await api("/api/auth/logout",{method:"POST"}); usuarioActual=null; irA("inicio"); if(socket) socket.disconnect(); };
  } else {
    zonaUsuario.innerHTML = `<button class="btn-secundario" id="btn-login" style="padding:6px 14px;">${t("nav.login")}</button>`;
    zonaUsuario.querySelector("#btn-login").onclick = ()=>{ seccionActual="login"; render(); };
  }
}

// ---------------------------------------------------------------------------
// RENDER PRINCIPAL
// ---------------------------------------------------------------------------
async function render(){
  renderNav();
  const main = document.getElementById("main");
  main.innerHTML = `<p style="color:var(--niebla-500);text-align:center;">${t("comun.cargando")}</p>`;
  const fns = { inicio:renderInicio, educacion:renderEducacion, tecnicas:renderTecnicas, cerebro:renderCerebro,
    login:renderLogin, registro:renderRegistro, diario:renderDiario, comunidad:renderComunidad,
    rutina:renderRutina, perfil:renderPerfil };
  main.innerHTML = "";
  await (fns[seccionActual] || renderInicio)(main);
  document.getElementById("footer").innerHTML = "🌙 Onírico — hecho para aprender y practicar sueños lúcidos.";
}

// --- INICIO ---
async function renderInicio(main){
  main.innerHTML = `
    <div style="padding-top:20px;display:flex;flex-direction:column;gap:18px;max-width:560px;">
      <span style="color:var(--rem-500);font-size:0.85rem;">Ciencia del sueño · Práctica guiada</span>
      <h1 class="font-display" style="font-size:2.4rem;line-height:1.15;margin:0;">${t("home.titulo")}</h1>
      <p style="color:var(--niebla-300);font-size:1.05rem;line-height:1.5;">${t("home.subtitulo")}</p>
      <div style="display:flex;gap:12px;flex-wrap:wrap;">
        <button class="btn" id="cta1">${usuarioActual? t("nav.diario") : t("home.cta")}</button>
        <button class="btn-secundario" id="cta2">${t("home.cta2")}</button>
      </div>
    </div>`;
  main.querySelector("#cta1").onclick = ()=> usuarioActual? irA("diario") : (seccionActual="registro", render());
  main.querySelector("#cta2").onclick = ()=> irA("educacion");
}

// --- EDUCACIÓN / APRENDER ---
const ARTICULOS_POR_IDIOMA = {

async function renderTecnicas(main){
  const TECNICAS = TECNICAS_POR_IDIOMA[idioma] || TECNICAS_POR_IDIOMA.es;
  if(tecnicaSeleccionada){ renderTecnicaDetalle(main, TECNICAS.find(t=>t.id===tecnicaSeleccionada)); return; }

  main.innerHTML = `<div class="seccion"><header><h1 class="font-display" style="font-size:1.9rem;margin:0 0 8px;">${t("tecnicas.titulo")}</h1><p style="color:var(--niebla-300);">${t("tecnicas.intro")}</p></header>
  <div class="filtros" id="filtros"></div>
  <div class="grid-tecnicas" id="grid-tecnicas"></div></div>`;

  const filtrosDiv = main.querySelector("#filtros");
  const niveles = [["todas",{es:"Todas",ca:"Totes",en:"All"}], ...Object.entries(EVIDENCIA_ESTILOS).map(([k,v])=>[k,v.label])];
  niveles.forEach(([clave,label])=>{
    const b = document.createElement("button"); b.className="filtro"+(filtroEvidencia===clave?" activo":"");

  const grid = main.querySelector("#grid-tecnicas");

        fill="${ZONAS.tronco.color}" fill-opacity="0.4" stroke="#05060d" stroke-width="2"/>

      <!-- Corteza prefrontal (zona clicable, lóbulo frontal) -->
      <ellipse class="zona" data-z="prefrontal" cx="92" cy="86" rx="46" ry="40" fill="${ZONAS.prefrontal.color}" fill-opacity="0.4" stroke="#05060d" stroke-width="2" clip-path="url(#clip-cerebro)"/>

      <!-- Sistema límbico (zona clicable, estructura profunda central) -->
      <circle class="zona" data-z="limbico" cx="172" cy="118" r="26" fill="${ZONAS.limbico.color}" fill-opacity="0.45" stroke="#05060d" stroke-width="2" stroke-dasharray="4 3"/>
    </svg>
    <div class="tarjeta" id="info-zona" style="flex:1;min-width:240px;"></div>
  </div>
  <div class="tarjeta">
    <h3 class="font-display" style="font-size:1.05rem;margin:0 0 8px;color:var(--rem-500);">${{es:"Los ciclos de la noche",ca:"Els cicles de la nit",en:"The cycles of the night"}[idioma]}</h3>
    <p style="color:var(--niebla-300);line-height:1.6;margin:0;">${{es:"Cada noche atraviesas entre 4 y 6 ciclos de sueño de unos 90 minutos cada uno. Cada ciclo recorre sueño ligero, sueño profundo y sueño REM, pero no a partes iguales: el sueño profundo predomina en los primeros ciclos de la noche, mientras que el REM (y con él, la mayoría de los sueños vívidos) se va alargando en los últimos. Por eso las técnicas como WBTB se practican de madrugada: es cuando hay más 'materia prima' onírica con la que trabajar.",ca:"Cada nit travesses entre 4 i 6 cicles de son d'uns 90 minuts cadascun. Cada cicle recorre son lleuger, son profund i son REM, però no a parts iguals: el son profund predomina als primers cicles de la nit, mentre que el REM (i amb ell, la majoria dels somnis vívids) es va allargant als últims. Per això tècniques com WBTB es practiquen de matinada.",en:"Each night you go through 4 to 6 sleep cycles of about 90 minutes each. Every cycle moves through light sleep, deep sleep and REM sleep, but not in equal parts: deep sleep dominates the early cycles of the night, while REM (and with it, most vivid dreams) gets longer toward the end. That's why techniques like WBTB are practiced in the early morning."}[idioma]}</p>
  </div>
  <div class="tarjeta">
    <h3 class="font-display" style="font-size:1.05rem;margin:0 0 8px;color:var(--luna-500);">${{es:"La química que hace posible soñar",ca:"La química que fa possible somiar",en:"The chemistry that makes dreaming possible"}[idioma]}</h3>
    <p style="color:var(--niebla-300);line-height:1.6;margin:0;">${{es:"Durante el sueño REM, el cerebro reduce drásticamente la producción de serotonina y noradrenalina (relacionadas con la alerta y el juicio crítico), mientras que la acetilcolina —ligada a la actividad eléctrica intensa— se mantiene alta. Esta combinación explica por qué los sueños pueden parecer tan reales y a la vez tan poco cuestionados: la parte del cerebro que normalmente diría 'esto es raro' está funcionando a media máquina.",ca:"Durant el son REM, el cervell redueix dràsticament la producció de serotonina i noradrenalina (relacionades amb l'alerta i el judici crític), mentre que l'acetilcolina —lligada a l'activitat elèctrica intensa— es manté alta. Aquesta combinació explica per què els somnis poden semblar tan reals i alhora tan poc qüestionats.",en:"During REM sleep, the brain drastically reduces serotonin and norepinephrine production (linked to alertness and critical judgment), while acetylcholine —tied to intense electrical activity— stays high. This combination explains why dreams can feel so real and go so unquestioned: the part of the brain that would normally say 'this is odd' is running at half power."}[idioma]}</p>
  </div>
  </div>`;
  function actualizar(){
    const z = ZONAS[zonaActiva];
    main.querySelector("#info-zona").innerHTML = `<h3 class="font-display" style="color:${z.color};margin:0 0 8px;">${z.nombre}</h3><p style="color:var(--niebla-300);line-height:1.6;margin:0;">${z.texto}</p>`;
    main.querySelectorAll(".zona").forEach(el=> el.setAttribute("fill-opacity", el.dataset.z===zonaActiva?"0.85":"0.4"));
  }
  main.querySelectorAll(".zona").forEach(el=> el.onclick=()=>{ zonaActiva=el.dataset.z; actualizar(); });
  actualizar();
}

// --- DIARIO ---
async function renderDiario(main){
  main.innerHTML = `<div class="seccion"><header style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;">
    <h1 class="font-display" style="font-size:1.9rem;margin:0;">${t("diario.titulo")}</h1>
    <button class="btn" id="btn-nuevo">${t("diario.nuevo")}</button></header>
    <div id="form-cont"></div><div id="lista-cont"></div></div>`;

  main.querySelector("#btn-nuevo").onclick = ()=> mostrarForm();

  function mostrarForm(sueno){
    const cont = main.querySelector("#form-cont");
    const hoy = new Date().toISOString().slice(0,10);
    cont.innerHTML = `<div class="tarjeta">
      <div class="campo"><label>${t("diario.fecha")}</label><input type="date" id="f-fecha" value="${sueno?new Date(sueno.fecha).toISOString().slice(0,10):hoy}"></div>
      <div class="campo"><label>${t("diario.texto")}</label><textarea id="f-texto" rows="4">${sueno?sueno.texto:""}</textarea></div>
      <div class="campo"><label>${t("diario.nivel")}: <span id="f-val" style="color:var(--luna-500);font-weight:700;">${sueno?sueno.nivelLucidez:0}</span></label><input type="range" min="0" max="5" id="f-nivel" value="${sueno?sueno.nivelLucidez:0}" style="accent-color:var(--aurora-500);"></div>
      <div class="campo"><label>${t("diario.senales")}</label><input id="f-senales" value="${sueno?(sueno.senalesOniricas||[]).join(", "):""}"></div>
      <div style="display:flex;gap:10px;"><button class="btn" id="f-guardar" style="flex:1;">${sueno?t("diario.actualizar"):t("diario.guardar")}</button><button class="btn-secundario" id="f-cancelar">${t("diario.cancelar")}</button></div>
    </div>`;
    cont.querySelector("#f-nivel").oninput=(e)=> cont.querySelector("#f-val").textContent=e.target.value;
    cont.querySelector("#f-cancelar").onclick=()=> cont.innerHTML="";
    cont.querySelector("#f-guardar").onclick = async ()=>{
      const body = { fecha:cont.querySelector("#f-fecha").value, texto:cont.querySelector("#f-texto").value,
        nivelLucidez:Number(cont.querySelector("#f-nivel").value), senalesOniricas:cont.querySelector("#f-senales").value.split(",").map(s=>s.trim()).filter(Boolean) };
      if(!body.texto.trim()) return;
      if(sueno) await api(`/api/suenos/${sueno._id}`,{method:"PUT",body:JSON.stringify(body)});
      else await api("/api/suenos",{method:"POST",body:JSON.stringify(body)});
      irA("diario");
    };
  }

  const {suenos} = await api("/api/suenos");
  const listaDiv = main.querySelector("#lista-cont");
  if(suenos.length===0){ listaDiv.innerHTML = `<p style="color:var(--niebla-500);text-align:center;margin-top:20px;">${t("diario.vacio")}</p>`; return; }
  listaDiv.style.display="flex"; listaDiv.style.flexDirection="column"; listaDiv.style.gap="14px";
  suenos.forEach(sueno=>{
    const art = document.createElement("div"); art.className="sueno-tarjeta";
    art.innerHTML = `<div class="sueno-header"><span>${new Date(sueno.fecha).toLocaleDateString()}</span><span class="pill">${t("diario.nivel")}: ${sueno.nivelLucidez}/5</span></div>
    <p style="white-space:pre-line;margin:0;">${sueno.texto}</p>
    <div>${(sueno.senalesOniricas||[]).map(s=>`<span class="senal">${s}</span>`).join("")}</div>
    <div style="display:flex;gap:16px;margin-top:12px;"><button class="btn-peligro" style="color:var(--rem-500);" data-a="editar">${t("diario.editar")}</button><button class="btn-peligro" data-a="borrar">${t("diario.borrar")}</button></div>`;
    art.querySelector('[data-a="editar"]').onclick=()=>mostrarForm(sueno);
    art.querySelector('[data-a="borrar"]').onclick=async()=>{ await api(`/api/suenos/${sueno._id}`,{method:"DELETE"}); irA("diario"); };
    listaDiv.appendChild(art);
  });
}

// --- COMUNIDAD (chat en tiempo real) ---
const CATEGORIAS_COMUNIDAD = {
  es: ["General","Primer sueño lúcido","Técnicas","Pesadillas","WBTB","MILD","SSILD","Experiencias","Consejos"],
  ca: ["General","Primer somni lúcid","Tècniques","Malsons","WBTB","MILD","SSILD","Experiències","Consells"],
  en: ["General","First lucid dream","Techniques","Nightmares","WBTB","MILD","SSILD","Experiences","Tips"]
};
let mensajesComunidad = [];
let categoriaFiltro = "Todos";

function conectarSocket(){
  if(socket) return;
  socket = io();
  socket.on("mensaje_recibido", (msg)=>{
    mensajesComunidad.push(msg);
    if(seccionActual==="comunidad") pintarMensajes();
  });
}
function pintarMensajes(){
  const cont = document.getElementById("chat-mensajes");
  if(!cont) return;
  cont.innerHTML = "";
  const lista = categoriaFiltro==="Todos" ? mensajesComunidad : mensajesComunidad.filter(m=>m.categoria===categoriaFiltro);
  lista.forEach(msg=>{
    const card = document.createElement("div"); card.className="post-tarjeta";
    card.innerHTML = `<div class="post-header">
        <span style="display:flex;align-items:center;gap:8px;font-size:0.85rem;color:var(--niebla-100);"><span style="font-size:1.1rem;">${msg.autorAvatar||"🌙"}</span> ${msg.autorNombre}</span>
        <span class="categoria-tag">${msg.categoria||"General"}</span>
      </div>
      <p style="margin:0;color:var(--niebla-300);font-size:0.9rem;">${msg.texto}</p>`;
    cont.appendChild(card);
  });
  cont.scrollTop = cont.scrollHeight;
}
async function renderComunidad(main){
  const CATS = CATEGORIAS_COMUNIDAD[idioma] || CATEGORIAS_COMUNIDAD.es;
  const catTodos = {es:"Todos",ca:"Totes",en:"All"}[idioma];
  main.innerHTML = `<div class="seccion"><header><h1 class="font-display" style="font-size:1.9rem;margin:0 0 8px;">${t("comunidad.titulo")}</h1><p style="color:var(--niebla-300);">${t("comunidad.intro")}</p></header>
  <div class="filtros" id="filtros-cat"></div>
  <div class="tarjeta chat-caja"><div class="chat-mensajes" id="chat-mensajes"></div>
  <form class="chat-form" id="chat-form" style="flex-wrap:wrap;">
    <select id="chat-categoria" style="width:auto;flex:0 0 auto;">${CATS.map(c=>`<option value="${c}">${c}</option>`).join("")}</select>
    <input id="chat-input" placeholder="${t("comunidad.placeholder")}" style="flex:1;min-width:120px;">
    <button class="btn" type="submit">${t("comunidad.enviar")}</button>
  </form></div></div>`;

  const filtrosDiv = main.querySelector("#filtros-cat");
  ["Todos", ...CATS].forEach((c,i)=>{
    const b = document.createElement("button"); b.className="filtro"+((c==="Todos"&&categoriaFiltro==="Todos")||c===categoriaFiltro?" activo":"");
    b.textContent = i===0?catTodos:c;
    b.onclick = ()=>{ categoriaFiltro = c==="Todos"?"Todos":c; main.querySelectorAll(".filtro").forEach(x=>x.classList.remove("activo")); b.classList.add("activo"); pintarMensajes(); };
    filtrosDiv.appendChild(b);
  });

  conectarSocket();
  if(mensajesComunidad.length===0){
    const {mensajes} = await api("/api/chat/historial");
    mensajesComunidad = mensajes;
  }
  pintarMensajes();
  main.querySelector("#chat-form").onsubmit = (e)=>{
    e.preventDefault();
    const input = main.querySelector("#chat-input");
    const categoria = main.querySelector("#chat-categoria").value;
    if(!input.value.trim()) return;
    socket.emit("mensaje_nuevo", {texto:input.value, categoria});
    input.value = "";
  };
}

// --- RUTINA ---
async function renderRutina(main){
  const {rutina} = await api("/api/rutina");
  const BLOQUES = [
    {clave:"manana", icono:"🌅", titulo:{es:"Por la mañana",ca:"Al matí",en:"In the morning"}},
    {clave:"dia", icono:"🧭", titulo:{es:"Durante el día",ca:"Durant el dia",en:"During the day"}},
    {clave:"noche", icono:"🌙", titulo:{es:"Antes de dormir",ca:"Abans de dormir",en:"Before sleep"}},
    {clave:"wbtb", icono:"⭐", titulo:{es:"Tras 5–6 horas (opcional)",ca:"Després de 5–6 hores (opcional)",en:"After 5–6 hours (optional)"}},
  ];
  main.innerHTML = `<div class="seccion"><header><h1 class="font-display" style="font-size:1.9rem;margin:0 0 8px;">${t("rutina.titulo")}</h1><p style="color:var(--niebla-300);">${t("rutina.intro")}</p></header>
  <div id="bloques-rutina"></div>
  <div class="aviso">⚠️ ${{es:"WBTB puede fragmentar tu descanso. Si al día siguiente notas cansancio, prioriza dormir seguido y deja WBTB para otra noche.",ca:"WBTB pot fragmentar el teu descans. Si l'endemà notes cansament, prioritza dormir seguit i deixa WBTB per a una altra nit.",en:"WBTB can fragment your rest. If you feel tired the next day, prioritize uninterrupted sleep and leave WBTB for another night."}[idioma]}</div>
  </div>`;
  const cont = main.querySelector("#bloques-rutina");
  BLOQUES.forEach(bloque=>{
    const items = rutina.filter(it=>it.bloque===bloque.clave);
    if(items.length===0) return;
    const div = document.createElement("div"); div.className="tarjeta bloque-rutina";
    div.innerHTML = `<h4>${bloque.icono} ${bloque.titulo[idioma]||bloque.titulo.es}</h4>`;
    items.forEach(it=>{
      const fila = document.createElement("label");
      fila.style.cssText = "display:flex;align-items:center;gap:10px;padding:6px 0;cursor:pointer;font-size:0.9rem;";
      fila.style.color = it.hecho ? "var(--niebla-500)" : "var(--niebla-100)";
      fila.style.textDecoration = it.hecho ? "line-through" : "none";
      fila.innerHTML = `<input type="checkbox" ${it.hecho?"checked":""} style="width:18px;height:18px;accent-color:var(--aurora-500);"> ${it.texto}`;
      fila.querySelector("input").onchange = async()=>{ await api(`/api/rutina/${it.id}/toggle`,{method:"PUT"}); irA("rutina"); };
      div.appendChild(fila);
    });
    cont.appendChild(div);
  });
}
